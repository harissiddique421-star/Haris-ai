name: Build FRIDAY APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "friday/**"
      - ".github/workflows/friday-apk.yml"
  schedule:
    # Weekly run keeps the cached signing key from expiring (GitHub drops caches unused for 7 days).
    - cron: "17 3 * * 1"
  push:
    branches: [main]
    paths:
      - "friday/**"
      - ".github/workflows/friday-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Test and build FRIDAY APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: friday
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: friday/package-lock.json
      - name: Install Android platform 35 and build-tools 35.0.0
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck and mobile tests
        run: |
          npx tsc --noEmit
          npm run test:mobile-actions
      - name: Reuse the CI signing key
        # Without a FRIDAY_KEYSTORE_BASE64 secret, the first main build generates a key and every
        # later build reuses it, so phones can update FRIDAY without uninstalling it.
        uses: actions/cache@v4
        with:
          path: friday/android/local-debug.keystore
          key: friday-ci-signing-key-v1
      - name: Build APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.FRIDAY_KEYSTORE_BASE64 }}
        run: ./scripts/build-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: friday-android-apk
          path: friday/artifacts/android/*.apk
          if-no-files-found: error
          retention-days: 14
