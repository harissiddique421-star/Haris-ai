name: Build FRIDAY APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "friday/**"
      - ".github/workflows/friday-apk.yml"
  push:
    branches: [main]
    paths:
      - "friday/**"
      - ".github/workflows/friday-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Test and build FRIDAY APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: friday
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: friday/package-lock.json
      - name: Install Android platform 35 and build-tools 35.0.0
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck and mobile tests
        run: |
          npx tsc --noEmit
          npm run test:mobile-actions
          npm run test:activation
      - name: Voice model checks (Silero VAD, speaker encoder, speech segmentation)
        run: ./scripts/test-voice-models.sh
      - name: Bootstrap sherpa-onnx pins (temporary)
        run: |
          python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install -q "sherpa-onnx==2.0.1" "sentencepiece==0.2.1" "pypinyin==0.55.0" "numpy<3"
          SHERPA_ALLOW_UNPINNED=1 SHERPA_KEEP_BPE="$RUNNER_TEMP/bpe.model" ./scripts/fetch-sherpa.sh jvm "$RUNNER_TEMP/s-jvm" 2> >(tee "$RUNNER_TEMP/pins.txt" >&2)
          SHERPA_ALLOW_UNPINNED=1 ./scripts/fetch-sherpa.sh android "$RUNNER_TEMP/s-android" 2> >(tee -a "$RUNNER_TEMP/pins.txt" >&2)
          "$RUNNER_TEMP/venv/bin/python" - "$RUNNER_TEMP/s-jvm/models/kws/tokens.txt" "$RUNNER_TEMP/bpe.model" > android/models/sherpa-keywords.txt <<'PY'
          import sys, sherpa_onnx
          phrases = ["WAKE UP FRIDAY", "FRIDAY WAKE UP", "HEY FRIDAY"]
          for toks, p in zip(sherpa_onnx.text2token(phrases, tokens=sys.argv[1], tokens_type="bpe", bpe_model=sys.argv[2]), phrases):
              print(" ".join(toks) + " @" + p.replace(" ", "_"))
          PY
          echo "== keywords"; cat android/models/sherpa-keywords.txt
          echo "== pins"; grep UNPINNED "$RUNNER_TEMP/pins.txt" | sed 's/^UNPINNED //' | sort -u | tee -a android/models/sherpa-onnx.sha256
          du -sh "$RUNNER_TEMP"/s-android/assets/sherpa/* "$RUNNER_TEMP"/s-android/lib/*/* || true
      - name: Voice engine checks (sherpa-onnx TitaNet and wake phrase spotting)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng
          ./scripts/test-sherpa.sh
      - name: Build APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.FRIDAY_KEYSTORE_BASE64 }}
        run: ./scripts/build-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: friday-android-apk
          path: friday/artifacts/android/*.apk
          if-no-files-found: error
          retention-days: 14
