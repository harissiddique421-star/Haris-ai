name: Publish FRIDAY update

# Runs only when the owner starts it (Actions > Publish FRIDAY update > Run workflow). This is the
# owner's approval to distribute a new version: it tests and builds main, signs the APK with the
# owner's key and publishes a GitHub release that FRIDAY on the phone can offer as an update.
# Phones still install nothing until the owner taps Install and confirms in Android.
on:
  workflow_dispatch:
    inputs:
      notes:
        description: "Optional note for this update (shown on the phone above the list of changes)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: friday-release
  cancel-in-progress: false

jobs:
  release:
    name: Test, build and publish FRIDAY
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: friday
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: friday/package-lock.json
      - name: Require the owner's signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.FRIDAY_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::FRIDAY_KEYSTORE_BASE64 is not set. An update signed with a throwaway key can't install over your FRIDAY, so nothing was published."
            exit 1
          fi
      - name: Stop if this version was already published
        run: |
          VERSION=$(sed -n 's/.*android:versionName="\([^"]*\)".*/\1/p' android/app/src/main/AndroidManifest.xml)
          if git rev-parse -q --verify "refs/tags/friday-v$VERSION" >/dev/null; then
            echo "::error::friday-v$VERSION is already published. Raise versionCode and versionName in AndroidManifest.xml first."
            exit 1
          fi
      - name: Install Android platform 35 and build-tools 35.0.0
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck and mobile tests
        run: |
          npx tsc --noEmit
          npm run test:mobile-actions
          npm run test:activation
      - name: Voice, self-development and update checks
        run: ./scripts/test-voice-models.sh
      - name: Build APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.FRIDAY_KEYSTORE_BASE64 }}
        run: ./scripts/build-android.sh
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER_NOTES: ${{ github.event.inputs.notes }}
        run: ./scripts/publish-friday-release.sh
